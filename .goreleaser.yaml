version: 2
project_name: jsonv2-audit
before:
  hooks:
    - go test -count=1 ./...
builds:
  - id: jsonv2-audit
    main: ./cmd/jsonv2-audit
    binary: jsonv2-audit
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  - id: jsonv2-audit-vet
    main: ./cmd/jsonv2-audit-vet
    binary: jsonv2-audit-vet
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  disable: true
release:
  draft: true
