name: Bug report
description: Something gives a wrong result, fails or crashes
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest Go package that shows it, the command you ran and the output. Use made-up data only.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Where it ran
      description: jsonv2-audit version or commit, `go version`, and the operating system
    validations:
      required: true
